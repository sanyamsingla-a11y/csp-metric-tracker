name: Daily Data Refresh

on:
  # Triggered once a day by the Vercel cron (api/trigger-refresh.js, 05:00 UTC = 10:30 IST) via workflow_dispatch.
  # The GitHub `schedule` trigger was removed 18-Nov: GitHub ran it hours late (12:00-14:00 UTC), so the full
  # refresh ran TWICE a day. daily_refresh_backup.yml still covers a missed Vercel trigger.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create .env from secret
        run: echo "METABASE_API_KEY:'${{ secrets.METABASE_API_KEY }}'" > .env

      - name: Run refresh
        run: python refresh_workflows.py

      - name: Commit and push
        run: |
          git config user.name "Sanyam Singla"
          git config user.email "sanyam.singla@wiom.in"
          git add workflow_data.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "daily refresh $(date -u +%d-%m-%Y)"
          git push
